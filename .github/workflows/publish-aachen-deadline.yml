# One-shot: publishes the Aachen deadline extension (20 -> 22 Sep) at
# midnight German time on 21 Sep 2026 by merging the prepared branch
# aachen-deadline-22sep into main, which triggers the Netlify deploy.
# The branch also deletes this workflow file, so it runs exactly once.
# (GitHub cron can fire with some delay; a date guard keeps early or
# repeated firings harmless.)

name: Publish Aachen deadline extension

on:
  schedule:
    # 2026-09-20 22:00 UTC = 2026-09-21 00:00 German time (CEST)
    - cron: "0 22 20 9 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge the prepared branch into main
        run: |
          if [ "$(date -u +%Y%m%d%H%M)" -lt 202609202200 ]; then
            echo "Too early, doing nothing."
            exit 0
          fi
          git config user.name "scheduled-publish"
          git config user.email "actions@github.com"
          git merge --no-edit origin/aachen-deadline-22sep
          git push
