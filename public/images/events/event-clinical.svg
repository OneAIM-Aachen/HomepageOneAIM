<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Clinical Session (Platzhalter)">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a6b5c"/>
      <stop offset="100%" stop-color="#0a8070"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#g)"/>
  <circle cx="680" cy="80"  r="240" fill="rgba(255,255,255,0.05)"/>
  <circle cx="60"  cy="420" r="160" fill="rgba(255,255,255,0.04)"/>
  <!-- Medical cross (large, centered) -->
  <rect x="340" y="140" width="120" height="40" rx="8" fill="rgba(255,255,255,0.18)"/>
  <rect x="380" y="100" width="40" height="120" rx="8" fill="rgba(255,255,255,0.18)"/>
  <!-- Pulse / heartbeat line -->
  <polyline points="60,300 180,300 220,240 260,360 300,240 340,300 460,300 500,260 540,300 800,300"
    fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="3" stroke-linecap="round"/>
  <!-- Small circles representing cells -->
  <circle cx="600" cy="200" r="30" fill="rgba(255,255,255,0.10)"/>
  <circle cx="640" cy="250" r="20" fill="rgba(255,255,255,0.08)"/>
  <circle cx="590" cy="270" r="14" fill="rgba(255,255,255,0.07)"/>
  <rect x="40" y="400" width="200" height="44" rx="8" fill="rgba(0,0,0,0.22)"/>
  <text x="56" y="428" font-family="Arial,sans-serif" font-size="15" fill="rgba(255,255,255,0.9)" font-weight="600">Clinical Deep Dive</text>
</svg>
