<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="AI Workshop (Platzhalter)">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f4a"/>
      <stop offset="100%" stop-color="#232ACF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#g)"/>
  <circle cx="700" cy="50"  r="270" fill="rgba(141,45,241,0.12)"/>
  <!-- Laptop silhouette -->
  <rect x="240" y="180" width="320" height="200" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <rect x="180" y="380" width="440" height="20" rx="6" fill="rgba(255,255,255,0.14)"/>
  <!-- Screen content (code lines) -->
  <rect x="260" y="200" width="180" height="10" rx="4" fill="rgba(141,45,241,0.55)"/>
  <rect x="260" y="220" width="240" height="10" rx="4" fill="rgba(255,255,255,0.18)"/>
  <rect x="280" y="240" width="160" height="10" rx="4" fill="rgba(255,255,255,0.14)"/>
  <rect x="280" y="260" width="200" height="10" rx="4" fill="rgba(212,0,255,0.35)"/>
  <rect x="260" y="280" width="120" height="10" rx="4" fill="rgba(255,255,255,0.12)"/>
  <rect x="260" y="300" width="190" height="10" rx="4" fill="rgba(141,45,241,0.40)"/>
  <rect x="280" y="320" width="140" height="10" rx="4" fill="rgba(255,255,255,0.12)"/>
  <!-- Neural network nodes (right side) -->
  <circle cx="580" cy="200" r="10" fill="rgba(255,255,255,0.25)"/>
  <circle cx="620" cy="250" r="10" fill="rgba(255,255,255,0.25)"/>
  <circle cx="580" cy="300" r="10" fill="rgba(255,255,255,0.25)"/>
  <circle cx="660" cy="300" r="10" fill="rgba(255,255,255,0.20)"/>
  <line x1="580" y1="200" x2="620" y2="250" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <line x1="580" y1="300" x2="620" y2="250" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <line x1="620" y1="250" x2="660" y2="300" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <rect x="40" y="400" width="200" height="44" rx="8" fill="rgba(0,0,0,0.30)"/>
  <text x="56" y="428" font-family="Arial,sans-serif" font-size="15" fill="rgba(255,255,255,0.9)" font-weight="600">AI in Healthcare Workshop</text>
</svg>
