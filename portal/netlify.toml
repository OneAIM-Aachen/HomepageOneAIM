# Netlify settings for the portal: team area (at /), applications (/apply)
# and network site (/network). See docs/deployment.md.
# In Netlify set "Base directory" to: portal
# Environment variables (Site configuration → Environment variables):
#   PUBLIC_SUPABASE_URL, PUBLIC_SUPABASE_ANON_KEY   (public values, see .env.example)
#   PUBLIC_SITE_URL, PUBLIC_TEAM_URL, PUBLIC_APPLY_URL, PUBLIC_NETWORK_URL   (addresses of the areas)
#   PUBLIC_INDEXABLE = "true" only on the live site: lets search engines list
#   the application pages (team area and network site never)

[build]
  command = "npm run build"
  publish = "dist"
  # Only rebuild when something in the portal folder changed
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"
  # Test site only: shows the "Demo data" switch in the team area
  # (made-up applications, only in the viewer's browser). Remove for the real portal.
  PUBLIC_DEMO_MODE = "true"
  # Bug report button in the team area (→ GitHub issues, see components/team/BugReport.tsx).
  # Remove this line, or set it to "false", to switch the button off.
  PUBLIC_BUG_REPORTS = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
